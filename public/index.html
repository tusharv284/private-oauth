<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OAuth Setup Guides</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; line-height: 1.5; }
  h1 { font-size: 1.4rem; }
  .search { display: flex; gap: 8px; margin: 20px 0; }
  input { flex: 1; padding: 10px; font-size: 1rem; }
  button { padding: 10px 16px; font-size: 1rem; cursor: pointer; }
  .card { border: 1px solid #8884; border-radius: 8px; padding: 14px 16px; margin: 10px 0; cursor: pointer; }
  .card:hover { border-color: #888; }
  .tier { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.7; }
  .tag { display: inline-block; font-size: 0.72rem; padding: 1px 7px; border-radius: 10px; margin-left: 6px; }
  .tag-tested { background: #1a7f371a; color: #1a7f37; }
  .tag-verified { background: #0969da1a; color: #0969da; }
  .tag-reported { background: #9a67001a; color: #9a6700; }
  .step { padding: 6px 0; border-bottom: 1px solid #8882; }
  .step:last-child { border-bottom: none; }
  .source-list { font-size: 0.85rem; opacity: 0.8; }
  .status { font-size: 0.85rem; opacity: 0.7; min-height: 1.2em; }
  a { color: inherit; }
  .back { cursor: pointer; opacity: 0.7; font-size: 0.85rem; }
</style>
</head>
<body>
  <h1>OAuth Setup Guides</h1>
  <p>Look up a provider's OAuth setup process, or type one not in the library below and generate it live.</p>
  <div class="search">
    <input id="q" placeholder="App name or URL, e.g. Notion or notion.so" />
    <button id="go">Generate</button>
  </div>
  <div id="status" class="status"></div>
  <div id="view"></div>

<script>
const view = document.getElementById('view');
const status = document.getElementById('status');

async function loadLibrary() {
  const res = await fetch('/api/guides');
  const guides = await res.json();
  view.innerHTML = '';
  for (const g of guides) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<strong>${g.appName}</strong> <span class="tier">${g.tier.replace('_',' ')}</span>
      <div>${g.devAccessEstimate}</div>`;
    card.onclick = () => renderGuide(g);
    view.appendChild(card);
  }
}

function tagClass(c) { return 'tag tag-' + c; }

function renderGuide(g) {
  const back = `<div class="back" onclick="loadLibrary()">&larr; back to library</div>`;
  const steps = g.steps.map(s =>
    `<div class="step">${s.order}. ${s.action} <span class="${tagClass(s.confidence)}">${s.confidence}</span></div>`
  ).join('');
  const blockers = g.blockers.length
    ? `<h3>Known blockers</h3><ul>${g.blockers.map(b => `<li>${b.description} (<a href="${b.sourceUrl}" target="_blank">source</a>)</li>`).join('')}</ul>`
    : '';
  const sources = `<h3>Sources</h3><div class="source-list">${g.sources.map(s => `<a href="${s.url}" target="_blank">${s.title}</a> &middot; checked ${s.checkedOn}`).join('<br>')}</div>`;
  view.innerHTML = `
    ${back}
    <h2>${g.appName} <span class="tier">${g.tier.replace('_',' ')}</span></h2>
    <p><strong>Dev access:</strong> ${g.devAccessEstimate}</p>
    <p><strong>Production / approval:</strong> ${g.productionEstimate}</p>
    <h3>Steps</h3>
    ${steps}
    ${blockers}
    <p><strong>If you get stuck:</strong> ${g.escalationPath}</p>
    ${sources}
    <p class="status">As of ${g.asOf} &middot; generated by ${g.generatedBy}</p>
  `;
}

document.getElementById('go').onclick = async () => {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  status.textContent = 'Researching ' + q + '... this can take 20-60 seconds.';
  view.innerHTML = '';
  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(q.includes('.') || q.startsWith('http') ? { appUrl: q.startsWith('http') ? q : 'https://' + q } : { appName: q }),
    });
    const data = await res.json();
    if (!res.ok) {
      status.textContent = '';
      view.innerHTML = `<p>Could not produce a guide that clears the confidence floor.</p>
        <pre style="white-space:pre-wrap">${JSON.stringify(data, null, 2)}</pre>`;
      return;
    }
    status.textContent = '';
    renderGuide(data);
  } catch (err) {
    status.textContent = 'Request failed: ' + err.message;
  }
};

window.loadLibrary = loadLibrary;
loadLibrary();
</script>
</body>
</html>
